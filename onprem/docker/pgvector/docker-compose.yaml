services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d
    networks:
      - sandbox

networks:
  sandbox:
    external: true

volumes:
  pgvector-data:
    name: pgvector-data